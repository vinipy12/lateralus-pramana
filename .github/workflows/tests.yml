name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SQLITE_TARBALL: https://sqlite.org/2026/sqlite-autoconf-3540000.tar.gz
  SQLITE_PREFIX: ${{ github.workspace }}/.sqlite

jobs:
  test:
    # Uses the runner's system Python 3.12, which links libsqlite3 dynamically,
    # so LD_LIBRARY_PATH can substitute a patched SQLite (>= 3.51.3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache SQLite build
        id: sqlite-cache
        uses: actions/cache@v4
        with:
          path: .sqlite
          key: sqlite-${{ runner.os }}-${{ env.SQLITE_TARBALL }}

      - name: Build SQLite from source
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sqlite-src"
          cd "$RUNNER_TEMP/sqlite-src"
          curl -fsSL "$SQLITE_TARBALL" | tar xz --strip-components=1
          ./configure --prefix="$SQLITE_PREFIX"
          make -j"$(nproc)"
          make install

      - name: Check linked SQLite version
        run: |
          echo "LD_LIBRARY_PATH=$SQLITE_PREFIX/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$SQLITE_PREFIX/lib" python3 -c 'import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)'

      - name: Lint
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet ruff==0.16.8
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Offline test suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Synthetic smoke run
        run: |
          PYTHONPATH=src python3 -m pramana smoke --run smoke-ci --cases 20
          PYTHONPATH=src python3 -m pramana report --run smoke-ci
